# Starship prompt — symlinked to ~/.config/starship.toml by setup.sh
# Catppuccin Mocha palette, two-line prompt: context on line 1, input on line 2.
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"
add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$kubernetes\
$docker_context\
$cmd_duration
$character"""

right_format = "$time"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
stashed = "≡"

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[python]
symbol = " "
style = "yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "red"
format = "[$symbol($version )]($style)"

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "sapphire"
format = "[$symbol$context( \\($namespace\\))]($style) "
# only show when a kube config is actually in play
detect_files = ["Dockerfile", "Containerfile", "kustomization.yaml", "Chart.yaml", "skaffold.yaml"]
detect_folders = ["k8s", "kube", "clusters", "charts"]

[docker_context]
symbol = " "
style = "sky"
format = "[$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 2000
style = "yellow"
format = "took [$duration]($style) "

[time]
disabled = false
style = "overlay1"
format = "[$time]($style)"
time_format = "%H:%M"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
